name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # The full proof tree (~240 modules) is far too heavy for a hosted runner, so CI builds only
      # the light, auditable specification and sanity-check targets.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Spec Challenge SanityChecks"
          test: false
          lint: false